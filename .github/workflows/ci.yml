name: Retirement CoPilot CI

on:

  push:
    branches:
      - main
      - streamlit-deploy

  pull_request:
    branches:
      - main
      - streamlit-deploy

jobs:

  validate:

    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: dummy-key
      
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # FRONTEND DEPENDENCIES
      # ============================================================

      - name: Install Frontend Dependencies
        run: |
          pip install -r requirements/frontend.txt

      # ============================================================
      # BACKEND DEPENDENCIES
      # ============================================================

      - name: Install Backend Dependencies
        run: |
          pip install -r requirements/backend.txt

      # ============================================================
      # PYTHON COMPILE CHECK
      # ============================================================

      - name: Validate Python Compilation
        run: |
          python -m compileall .

      # ============================================================
      # FASTAPI IMPORT CHECK
      # ============================================================

      - name: Validate FastAPI App
        run: |
          python -c "from backend.main import app"

      # ============================================================
      # STREAMLIT IMPORT CHECK
      # ============================================================

      - name: Validate Streamlit Imports
        run: |
          python -c "import streamlit"
