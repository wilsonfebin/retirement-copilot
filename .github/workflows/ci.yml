name: Retirement CoPilot CI

on:

  push:
    branches:
      - main

jobs:

  validate:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements/frontend.txt

      - name: Validate Imports
        run: |
          python -m compileall .
